<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWAアイコンジェネレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* カスタムスタイル */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
        }
        .icon-preview-container {
            width: 160px;
            height: 160px;
            box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        .icon-text {
            line-height: 1;
        }
        .btn-primary {
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        /* カラーパレットのボタンのスタイル */
        .color-preset-button {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: all 0.15s;
        }
        .color-preset-button:hover {
            opacity: 0.8;
        }
        .color-preset-button.selected {
            border-color: #3b82f6; /* Tailwind blue-500 */
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body>

<div class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-4xl grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="lg:col-span-1 flex flex-col items-center justify-center space-y-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">アイコンプレビュー</h2>
            <div id="icon-preview-container" class="icon-preview-container rounded-3xl flex items-center justify-center text-6xl font-extrabold select-none">
                <span id="icon-text" class="icon-text">✨</span>
            </div>
            <p class="text-sm text-gray-500 mt-2">ホーム画面に追加されるアイコンのイメージです。</p>
        </div>

        <div class="lg:col-span-2 space-y-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">アイコン設定</h2>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">中央のマーク選択</label>
                <div id="mark-presets" class="flex flex-wrap gap-2 p-2 bg-gray-50 rounded-lg mb-3 border border-gray-200">
                    </div>

                <label for="icon-input" class="block text-sm font-medium text-gray-700 mb-1">または直接入力 / Font Awesome (`<i class='...'></i>`)</label>
                <input type="text" id="icon-input" value="✨" maxlength="50" 
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-lg" 
                       placeholder="例: A, 🚀, <i class='fas fa-code'></i>">
            </div>
            
            <div class="space-y-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">カラーパレット選択</label>
                <div id="color-presets" class="flex flex-wrap gap-3 p-2 bg-gray-50 rounded-lg border border-gray-200">
                    </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="bg-color" class="block text-sm font-medium text-gray-700 mb-1">背景色 (HEXコード)</label>
                    <div class="flex items-center space-x-2">
                        <input type="color" id="bg-color-picker" value="#3b82f6" class="w-10 h-10 rounded-lg cursor-pointer">
                        <input type="text" id="bg-color-text" value="#3b82f6" 
                               class="w-full p-2 border border-gray-300 rounded-lg text-sm" 
                               maxlength="7" placeholder="#RRGGBB">
                    </div>
                </div>
                
                <div>
                    <label for="text-color" class="block text-sm font-medium text-gray-700 mb-1">文字色 (HEXコード)</label>
                    <div class="flex items-center space-x-2">
                        <input type="color" id="text-color-picker" value="#ffffff" class="w-10 h-10 rounded-lg cursor-pointer">
                        <input type="text" id="text-color-text" value="#ffffff" 
                               class="w-full p-2 border border-gray-300 rounded-lg text-sm" 
                               maxlength="7" placeholder="#RRGGBB">
                    </div>
                </div>
            </div>

            <button id="generate-button" class="btn-primary w-full bg-blue-600 text-white font-semibold py-3 rounded-xl shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                <i class="fas fa-download mr-2"></i> PWAアイコンとマニフェストをダウンロード
            </button>
            
            <div id="message-box" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg relative" role="alert">
                <span class="block sm:inline" id="message-text"></span>
            </div>

            <canvas id="icon-canvas" style="display:none;"></canvas>
        </div>

    </div>
</div>

<script>
    const iconInput = document.getElementById('icon-input');
    const iconText = document.getElementById('icon-text');
    const iconPreviewContainer = document.getElementById('icon-preview-container');
    const bgColorPicker = document.getElementById('bg-color-picker');
    const bgColorText = document.getElementById('bg-color-text');
    const textColorPicker = document.getElementById('text-color-picker');
    const textColorText = document.getElementById('text-color-text');
    const generateButton = document.getElementById('generate-button');
    const messageBox = document.getElementById('message-box');
    const messageText = document.getElementById('message-text');
    const iconCanvas = document.getElementById('icon-canvas');
    const ctx = iconCanvas.getContext('2d');
    const markPresetsContainer = document.getElementById('mark-presets');
    const colorPresetsContainer = document.getElementById('color-presets');

    // --- プリセットデータの定義 ---

    // 1. マークプリセット (絵文字/Font Awesome)
    const MARK_PRESETS = [
        // 絵文字
        { value: '🚀', label: 'ロケット' },
        { value: '💡', label: 'アイデア' },
        { value: '📝', label: 'ノート' },
        { value: '⭐', label: 'スター' },
        { value: '📚', label: 'ブック' },
        { value: '🔑', label: 'キー' },
        // Font Awesome (iタグ形式で格納)
        { value: "<i class='fas fa-code'></i>", label: 'コード' },
        { value: "<i class='fas fa-chart-line'></i>", label: 'チャート' },
        { value: "<i class='fas fa-bell'></i>", label: 'ベル' },
        { value: "<i class='fas fa-user'></i>", label: 'ユーザー' },
        { value: "<i class='fas fa-home'></i>", label: 'ホーム' },
    ];

    // 2. カラーパレットプリセット (背景色, 文字色)
    const COLOR_PRESETS = [
        { bg: '#3b82f6', text: '#ffffff', name: 'ブルー (白文字)' }, // Blue
        { bg: '#10b981', text: '#ffffff', name: 'エメラルド (白文字)' }, // Emerald
        { bg: '#ef4444', text: '#ffffff', name: 'レッド (白文字)' }, // Red
        { bg: '#f59e0b', text: '#1f2937', name: 'アンバー (濃い文字)' }, // Amber
        { bg: '#e5e7eb', text: '#1f2937', name: 'ライトグレー (濃い文字)' }, // Light Gray
        { bg: '#1f2937', text: '#f3f4f6', name: 'ダーク (明るい文字)' }, // Dark
        // --- 新しく追加されたパレット ---
        { bg: '#9333ea', text: '#ffffff', name: 'バイオレット (白文字)' }, // Violet
        { bg: '#0d9488', text: '#1f2937', name: 'ティール (濃い文字)' }, // Teal
        { bg: '#ec4899', text: '#1f2937', name: 'ピンク (濃い文字)' }, // Pink
        { bg: '#f97316', text: '#ffffff', name: 'オレンジ (白文字)' }, // Orange
        { bg: '#a3a3a3', text: '#ffffff', name: 'ミディアムグレー (白文字)' }, // Medium Gray
        { bg: '#171717', text: '#0d9488', name: 'ブラック (ティール文字)' } // Black/Teal
    ];


    // --- プレビューの更新 ---
    function updatePreview() {
        const bgColor = bgColorText.value;
        const textColor = textColorText.value;
        const iconContent = iconInput.value;

        // 背景色の更新
        iconPreviewContainer.style.backgroundColor = bgColor;
        
        // アイコンコンテンツの更新 (HTML対応)
        iconText.style.color = textColor;
        
        // Font Awesomeクラスを含む場合はinnerHTML、そうでなければtextContent
        if (iconContent.includes('<i') || iconContent.includes('<span')) {
            iconText.innerHTML = iconContent;
            iconText.style.fontSize = '40px'; // Font Awesomeは小さめに
            iconText.style.fontWeight = 'normal';
        } else {
            iconText.innerHTML = '';
            iconText.textContent = iconContent;
            // 1文字の絵文字/文字なら大きく、それ以外は小さく
            iconText.style.fontSize = iconContent.length === 1 ? '72px' : '48px'; 
            iconText.style.fontWeight = '800';
        }
    }

    // --- カラーピッカーとテキストの同期 ---
    function syncColors(sourceId, targetId) {
        const source = document.getElementById(sourceId);
        const target = document.getElementById(targetId);
        source.addEventListener('input', () => {
            target.value = source.value;
            updatePreview();
            // 色が変わったら、パレットの選択状態を解除
            document.querySelectorAll('.color-preset-button').forEach(btn => btn.classList.remove('selected'));
        });
        target.addEventListener('input', () => {
            source.value = target.value;
            updatePreview();
            // 色が変わったら、パレットの選択状態を解除
            document.querySelectorAll('.color-preset-button').forEach(btn => btn.classList.remove('selected'));
        });
    }

    // --- プリセットボタンの生成とイベント設定 ---

    function createMarkPresets() {
        MARK_PRESETS.forEach(mark => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'text-2xl p-2 rounded-lg bg-white shadow hover:bg-gray-100 transition';
            
            // HTMLタグを含む場合はinnerHTML、絵文字/文字の場合はtextContent
            if (mark.value.includes('<i')) {
                btn.innerHTML = mark.value;
                btn.title = mark.label;
            } else {
                btn.textContent = mark.value;
                btn.title = mark.label;
            }

            btn.addEventListener('click', () => {
                iconInput.value = mark.value;
                updatePreview();
            });
            markPresetsContainer.appendChild(btn);
        });
    }

    function createColorPresets() {
        COLOR_PRESETS.forEach((palette, index) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'color-preset-button flex items-center justify-center';
            btn.title = palette.name;
            btn.style.backgroundColor = palette.bg;
            
            // 内部のテキスト/アイコン (文字色を示すための小さなマーク)
            const innerMark = document.createElement('span');
            innerMark.className = 'text-lg';
            innerMark.textContent = 'A'; // テキストのサンプル
            innerMark.style.color = palette.text;
            btn.appendChild(innerMark);

            // 初期選択状態の設定
            if (index === 0) {
                btn.classList.add('selected');
            }

            btn.addEventListener('click', () => {
                // すべてのボタンの選択状態を解除
                document.querySelectorAll('.color-preset-button').forEach(b => b.classList.remove('selected'));
                // クリックされたボタンを選択状態に
                btn.classList.add('selected');
                
                // 色をフォームとプレビューに適用
                bgColorPicker.value = palette.bg;
                bgColorText.value = palette.bg;
                textColorPicker.value = palette.text;
                textColorText.value = palette.text;
                updatePreview();
            });
            colorPresetsContainer.appendChild(btn);
        });
    }


    // --- イベントリスナー設定 ---
    iconInput.addEventListener('input', updatePreview);
    syncColors('bg-color-picker', 'bg-color-text');
    syncColors('text-color-picker', 'text-color-text');
    
    // 初期化
    createMarkPresets();
    createColorPresets();
    
    // 初期表示を更新
    window.onload = updatePreview;

    // --- 画像生成とダウンロードロジック ---
    function drawIconOnCanvas(size) {
        iconCanvas.width = size;
        iconCanvas.height = size;

        const bgColor = bgColorText.value;
        const textColor = textColorText.value;
        const iconContent = iconInput.value;
        
        // 1. 背景を描画
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, size, size);

        // 2. テキスト/アイコンの準備
        ctx.fillStyle = textColor;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle'; // 垂直方向の基準を中央に設定

        const centerX = size / 2;
        let centerY = size / 2;
        
        // 描画するテキストとフォントサイズの決定
        let textToDraw = iconContent;
        let fontSize;
        let isFa = iconContent.includes('<i') || iconContent.includes('<span');
        
        if (isFa) {
            // Font Awesomeの場合: Canvasでは描画できないため、タグを削除したテキストを可能な限り描画する
            textToDraw = iconContent.replace(/<[^>]*>/g, '').trim(); 
            if(textToDraw === '') textToDraw = "FA"; // タグのみの場合はフォールバックとして「FA」を描画
            fontSize = size * 0.35; // プレビューのFont Awesomeサイズに合わせる
        } else if (iconContent.length === 1) {
            // 単一文字/絵文字
            fontSize = size * 0.55; 
        } else {
            // 複数文字
            fontSize = size * 0.4;
        }

        ctx.font = `bold ${fontSize}px Inter, sans-serif`;
        
        // 垂直方向の微調整: 視覚的な中央揃えのため、下にずれるのを補正する (約5%上に移動)
        let verticalOffset = size * 0.05; 
        
        // 3. テキストを描画
        // Font Awesomeタグの場合は補正なし、テキスト/絵文字の場合に補正を適用
        ctx.fillText(textToDraw, centerX, centerY + (isFa ? 0 : -verticalOffset));
        
        // 4. ダウンロード
        const dataURL = iconCanvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.href = dataURL;
        link.download = `icon-${size}x${size}.png`; 
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    
    function downloadManifest(shortName, startUrl, displayMode, themeColor) {
        const manifest = {
            "name": "あなたのPWAアプリ名 (変更してください)",
            "short_name": shortName,
            "description": "このアプリの説明を記述してください。",
            "icons": [
                {
                    "src": "icon-192x192.png",
                    "sizes": "192x192",
                    "type": "image/png"
                },
                {
                    "src": "icon-512x512.png",
                    "sizes": "512x512",
                    "type": "image/png"
                }
            ],
            "start_url": startUrl,
            "display": displayMode,
            "background_color": themeColor,
            "theme_color": themeColor
        };
        
        const manifestContent = JSON.stringify(manifest, null, 2);
        const blob = new Blob([manifestContent], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        
        const link = document.createElement('a');
        link.href = url;
        link.download = 'manifest.json';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        URL.revokeObjectURL(url);
    }

    generateButton.addEventListener('click', () => {
        // ダウンロード開始メッセージを表示
        messageText.textContent = "アイコン画像を生成し、ダウンロードを開始します...";
        messageBox.classList.remove('hidden');
        messageBox.classList.remove('bg-red-100', 'border-red-400', 'text-red-700');
        messageBox.classList.add('bg-green-100', 'border-green-400', 'text-green-700');
        
        // 1. 各サイズを生成してダウンロード
        drawIconOnCanvas(192);
        drawIconOnCanvas(512);
        
        // 2. manifest.jsonをダウンロード (サンプルの内容で)
        // Font Awesomeタグを考慮し、短い名前の決定ロジックを改善
        let shortName = iconInput.value.replace(/<[^>]*>/g, '');
        if (shortName.length > 8) shortName = "MyApp"; 
        if (shortName.trim() === '') shortName = "IconApp";

        const themeColor = bgColorText.value;
        // start_urlを相対パス "./index.html" に設定
        downloadManifest(shortName, "./index.html", "standalone", themeColor);

        messageText.innerHTML = `✅ **icon-192x192.png**、**icon-512x512.png**、**manifest.json** のダウンロードを開始しました。これらのファイルをWebアプリのルートディレクトリに配置してください。`;
    });
</script>

</body>
</html>
